# paperpipe 注册表 · agents —— 子智能体角色（唯一事实源）
# 触发原则：按风险与独立性拆分，不每个任务都拆；简单摘要/单张静态图/封面不默认拆。
# 纪律：子智能体不直接修改其他 agent 正在写的文件；每个 handoff 有输入快照、输出目录、状态与回传格式。

agents:
  - id: researcher
    system_prompt: prompts/researcher.md
    purpose: 论文解析主稿（deep-read 补全：机制点/会怎么坏/可手算例/证据分级）
    trigger: 有视频/图解交付目标（所有 target 均触发）
    inputs: [paper_src/]
    outputs: [2-xray/deep-read.md]
    parallel_with: [fact_checker]
    forbidden: 不得同时改 brief.md；只读固定版本的 paper_src 输入快照
  - id: fact_checker
    system_prompt: prompts/fact_checker.md
    purpose: 独立核验数字、公式、结论与归属
    trigger: 论文 ≥20 页 / 数字结论重要 / 用户要求"讲透""严谨核对"
    inputs: [2-xray/deep-read.md, paper_src/]
    outputs: [handoffs/<id>/response.json]
    parallel_with: [researcher, visual_planner, example_writer]
    forbidden: 不得直接改 deep-read.md——只回传问题清单与证据，由整合方落盘
  - id: example_writer
    system_prompt: prompts/example_writer.md
    purpose: 举例细化讲解——把每个机制点转成「具象对象 + 场景描述 + 讲解文本」的例举规格
    trigger: 有视频交付目标
    inputs: [2-xray/deep-read.md, 0-brief/brief.md]
    outputs: [3-figures/examples_spec.json]
    parallel_with: [fact_checker, data_viz_builder, style_director]
    forbidden: 不得动 three.js 代码（那是 model_builder 的事）；不得与 data_viz_builder 共写同一文件
  - id: data_viz_builder
    system_prompt: prompts/data_viz_builder.md
    purpose: 数据 3D 规格提取——把论文中的数字/表格/公式转成 3D 数据组件规格（柱阵/体素/曲面/管曲线/表盘）
    trigger: 有视频交付目标且论文含可 3D 化的数据
    inputs: [2-xray/deep-read.md]
    outputs: [3-figures/dataviz_spec.json]
    parallel_with: [fact_checker, example_writer, style_director]
    forbidden: 与 example_writer 分开——数据和举例各自独立规格，最后由 aggregator 合并
  - id: style_director
    system_prompt: prompts/style_director.md
    purpose: 代码动画风格选型——从 341 风格库为每章指定参考风格（编号+职责+有无静帧）
    trigger: design.cap_enabled=on 或用户点名风格编号；有视频交付目标
    inputs: [0-brief/brief.md, 3-figures/examples_spec.json, engines/code-animation-prompts/references/catalog.json]
    outputs: [3-figures/style_refs.json]
    parallel_with: [example_writer, data_viz_builder]
    forbidden: 不得机械叠加多个风格的全部约束（须分主画风/运动/版式）；不得声称无静帧条目有图；不得当 3D 模型库用
  - id: spec_enricher
    system_prompt: prompts/spec_enricher.md
    purpose: 规格丰富优化——把两份裸规格熔炼成 model_builder 可直接执行的制作级规格
    trigger: example_writer + data_viz_builder 的 handoff 均 passed 后串行启动
    inputs: [3-figures/examples_spec.json, 3-figures/dataviz_spec.json, 3-figures/style_refs.json, 0-brief/brief.md]
    outputs: [3-figures/enriched_spec.json]
    parallel_with: []
    forbidden: 不发明新内容；不改数字；不写 three.js 代码；不确定就保守
  - id: model_builder
    system_prompt: prompts/model_builder.md
    purpose: three.js 3D 建模实现——吃 example_writer 的例举规格 + data_viz_builder 的数据规格，产出场景代码
    trigger: 收到两份规格后串行启动（不与它们并行）
    inputs: [3-figures/enriched_spec.json, 3-figures/style_refs.json]
    outputs: [compositions 3D 场景代码]
    parallel_with: [narration_editor]
    forbidden: 不得自行发明例子（只实现规格）；不得改 brief.md/pipeline-state.json
  - id: aggregator
    system_prompt: prompts/aggregator.md
    purpose: 最终汇总——把所有 subagent 产出组装成 compositions + 时间轴 + 字幕，确保风格一致与零遮挡
    trigger: 全部前序 handoff passed 后串行启动
    inputs: [3-figures/examples_spec.json, 3-figures/dataviz_spec.json, 4-video/hf/compositions/]
    outputs: [4-video/hf/index.html, 4-video/narration.json, 4-video/hf/compositions/captions.html]
    parallel_with: []
    forbidden: 串行——不与任何其他 agent 并行；对最终布局审计负全责
  - id: visual_planner
    system_prompt: prompts/visual_planner.md
    purpose: 生成镜头、图解与动效匹配登记表
    trigger: 视频 >5 分钟或镜头 >8 个
    inputs: [2-xray/deep-read.md, 0-brief/brief.md]
    outputs: [3-figures/README.md, 4-video/narration.json]
    parallel_with: [fact_checker]
    forbidden: 不得写 pipeline-state.json；不得与 narration_editor 同时写 narration.json
  - id: narration_editor
    purpose: 旁白与 TTS 可读性、术语一致性
    trigger: 旁白复杂（长句多/术语新）或用户反馈过语速/重复
    inputs: [4-video/narration.json, 2-xray/deep-read.md]
    outputs: [4-video/narration.json（独占写窗口）]
    parallel_with: []
    forbidden: 与 visual_planner 写冲突；改动前取输入快照
  - id: render_worker
    purpose: 只负责渲染和编码命令执行
    trigger: render 阶段机器执行
    inputs: [4-video/narration.json, render.composition/script 配置]
    outputs: [4-video/render-raw.mp4, 4-video/final.mp4, receipts/tools/*.json]
    parallel_with: []
    forbidden: 不做内容决策；不得跳过产物存在性断言
  - id: technical_qa
    purpose: 音轨/编码/冻结帧/空帧机器与内容技术检查
    trigger: 渲染完成后（与 visual_qa 并行）
    inputs: [4-video/final.mp4]
    outputs: [5-video-final/qa_report.json, receipts/skills/qa-*.json]
    parallel_with: [visual_qa]
    forbidden: 不得同时写同一 QA 报告文件（各自目录，整合方合并）
  - id: visual_qa
    purpose: 遮挡/安全区/构图/字幕审查
    trigger: 渲染完成后（与 technical_qa 并行）
    inputs: [4-video/final.mp4 抽帧, 4-video/narration.json]
    outputs: [receipts/skills/qa-layout-safety-review*.json]
    parallel_with: [technical_qa]
    forbidden: 同上
  - id: release_reviewer
    purpose: 确认发布条件（QA/复盘/哈希/封面/回执）
    trigger: 真实发布前
    inputs: [pipeline-state.json, 5-video-final/]
    outputs: [receipts/agents/<id>.json]
    parallel_with: []
    forbidden: 不执行上传；只验证与出具结论

# 并行规则（整合方必须遵守）：
# - acquire 完成后：fact_checker / example_writer / data_viz_builder / style_director 四路并行（都只读固定快照）；
# - 全部回传后：model_builder 串行接手（吃两份规格产出场景代码）；
# - model_builder 完成后：aggregator 串行汇总（compositions + 时间轴 + 字幕）；
# - render 完成后：technical_qa 与 visual_qa 可并行（各自输出目录）；
# - 最终整合、pipeline-state.json 写入、发布动作必须串行；
# - 禁止两个 agent 同时写 brief.md / pipeline-state.json / 同一视频源文件。
